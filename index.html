  --ok: #5BD38A; --ok-soft: #14291D; --ok-line: #2C6B45; --bad: #FF8A80; --bad-soft: #321A1A; --bad-line: #7A3530;
  --warn: #F2B65A; --warn-soft: #2E2414;

:root[data-palette="ocean"] { --bg: #F2F6FA; --surface: #FFFFFF; --surface-2: #E8EFF6; --border: #DAE4EE; --border-strong: #C3D2E2; --text: #0F1E2E; --muted: #4F6275; --faint: #7F90A3; --accent: #0B6BCB; --accent-hover: #0858A8; --accent-ink: #0A5CAD; --accent-soft: #E1EEFB; }

:root[data-palette="midnight"], :root[data-palette="graphite"], :root[data-palette="emerald-night"], :root[data-palette="ruby-night"], :root[data-palette="deep-ocean"], :root[data-palette="amethyst"], :root[data-palette="amber-night"] { --ok: #5BD38A; --ok-soft: #14291D; --ok-line: #2C6B45; --bad: #FF8A80; --bad-soft: #321A1A; --bad-line: #7A3530; --warn: #F2B65A; --warn-soft: #2E2414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lg: 0 2px 4px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.45); color-scheme: dark; }
:root[data-palette="graphite"] { --bg: #121214; --surface: #1A1A1D; --surface-2: #232327; --border: #2E2E33; --border-strong: #3F3F46; --text: #EDEDF0; --muted: #A7A7B0; --faint: #7C7C86; --accent: #E4E4E7; --accent-hover: #FFFFFF; --accent-ink: #F4F4F5; --accent-soft: #2A2A2F; --on-accent: #111113; }
:root[data-palette="emerald-night"] { --bg: #0C1411; --surface: #121C18; --surface-2: #18251F; --border: #22332B; --border-strong: #2F463B; --text: #E6F0EA; --muted: #9DB3A6; --faint: #6F877A; --accent: #34D399; --accent-hover: #4ADEAA; --accent-ink: #6EE7B7; --accent-soft: #15302A; --on-accent: #06281C; }
:root[data-palette="ruby-night"] { --bg: #150E10; --surface: #1E1416; --surface-2: #281B1E; --border: #362328; --border-strong: #4A2F36; --text: #F3E8EA; --muted: #BBA0A6; --faint: #8C737A; --accent: #F0506E; --accent-hover: #F56A84; --accent-ink: #FF8FA3; --accent-soft: #3A1A22; --on-accent: #23070D; }
:root[data-palette="deep-ocean"] { --bg: #0B1220; --surface: #111A2B; --surface-2: #172338; --border: #20304A; --border-strong: #2C4163; --text: #E6EEF9; --muted: #9CB0CC; --faint: #6C809E; --accent: #38BDF8; --accent-hover: #5CCBFA; --accent-ink: #7DD3FC; --accent-soft: #0F2A40; --on-accent: #04202F; }
:root[data-palette="amethyst"] { --bg: #130F1A; --surface: #1B1524; --surface-2: #241C30; --border: #312640; --border-strong: #433456; --text: #EFE9F7; --muted: #B2A5C6; --faint: #84779A; --accent: #C084FC; --accent-hover: #CF9CFD; --accent-ink: #D8B4FE; --accent-soft: #2E1F45; --on-accent: #1F0B33; }
:root[data-palette="amber-night"] { --bg: #14110B; --surface: #1C1810; --surface-2: #262016; --border: #342C1E; --border-strong: #473D2A; --text: #F4EEE2; --muted: #BDB19A; --faint: #8C826E; --accent: #FBBF24; --accent-hover: #FCCB4A; --accent-ink: #FCD34D; --accent-soft: #3A2E12; --on-accent: #2A1F02; }
:root[data-palette] .btn-danger { color: #fff; }
:root[data-palette="midnight"] .btn-danger, :root[data-palette="graphite"] .btn-danger, :root[data-palette="emerald-night"] .btn-danger, :root[data-palette="ruby-night"] .btn-danger, :root[data-palette="deep-ocean"] .btn-danger, :root[data-palette="amethyst"] .btn-danger, :root[data-palette="amber-night"] .btn-danger { color: #1a0d0c; }
.theme-wrap { position: relative; display: flex; align-items: center; flex: none; }
.theme-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, border-color .2s, transform .2s; }
.theme-btn svg { width: 19px; height: 19px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.theme-btn[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.theme-btn[aria-expanded="true"] svg { transform: rotate(-35deg) scale(1.08); }
.swatch { width: 20px; height: 20px; border-radius: 50%; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.theme-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; width: 236px; max-width: calc(100vw - 32px); max-height: min(70vh, 560px); overflow-y: auto; overscroll-behavior: contain; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); display: grid; gap: 2px;
  opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.97); transform-origin: top left; transition: opacity .22s ease, transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s linear .26s; }
.theme-menu.open { opacity: 1; visibility: visible; transform: none; transition: opacity .22s ease, transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.theme-group { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.theme-opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer; }
.theme-opt[aria-checked="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.theme-opt .check { margin-left: auto; width: 16px; height: 16px; }
.name-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .name-row { grid-template-columns: 1fr; } }
.name-fields { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.name-fields legend { padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 550; color: var(--muted); }
.student { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 550; color: var(--muted); min-width: 0; }
.student svg { width: 15px; height: 15px; flex: none; }
.student span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button, .flashcard, .tile, .choice, .tab { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Header ---------- */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.header-row { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.brand { min-width: 0; display: flex; font-size: 16px !important; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; background: none; border: 0; padding: 4px 0; cursor: pointer; white-space: nowrap; }
.brand-mark { display: none !important;  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: -0.02em; }
.nav-links { display: flex; gap: 2px; margin-left: auto; }
.nav-link { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: var(--r-sm); border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
@media (hover: hover) { .nav-link:hover { background: var(--surface-2); color: var(--text); } }
.nav-link[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }
.nav-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.tabbar { display: none; }
@media (max-width: 820px) {
  .nav-links { display: none; }
  .header-row { height: 52px; }
  .tabbar { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tab { position: relative; display: grid; justify-items: center; gap: 3px; padding: 6px 0 4px; border: 0; background: none; border-radius: 10px; color: var(--faint); font-size: 10.5px; font-weight: 550; cursor: pointer; min-width: 0; }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--accent-ink); }
  .tab .tab-dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 10px; display: grid; place-items: center; }
  body.typing .tabbar { display: none; }
  main { padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)) !important; }
  footer { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
}

/* ---------- Main ---------- */
main { padding-block: 32px 64px; }
.screen { display: grid; gap: 28px; }
.screen.enter { animation: enter .28s ease both; }
@keyframes enter { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head h1 { font-size: 26px; font-weight: 650; }
.page-head p { color: var(--muted); margin-top: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
.section { display: grid; gap: 14px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 16px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .08s, box-shadow .15s; white-space: nowrap; text-decoration: none; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 1px 2px rgba(40, 30, 160, .2); }
@media (hover: hover) { .btn-primary:hover:not(:disabled) { background: var(--accent-hover); } }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
@media (hover: hover) { .btn-secondary:hover:not(:disabled) { background: var(--surface-2); } }
.btn-ghost { background: transparent; color: var(--muted); }
@media (hover: hover) { .btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); } }
.btn-danger { background: var(--bad); color: #fff; }
@media (hover: hover) { .btn-danger:hover:not(:disabled) { filter: brightness(1.08); } }
:root[data-theme="dark"] .btn-danger { color: #1a0d0c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-danger { color: #1a0d0c; } }
.btn-lg { min-height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn-sm { min-height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn-icon { width: 40px; padding: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.center { justify-content: center; }

/* ---------- Cards / surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.panel-pad { padding: 24px; }
@media (max-width: 520px) { .panel-pad { padding: 18px; } }

/* ---------- Home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.hero h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; letter-spacing: -0.03em; }
.hero p.sub { font-size: 17px; color: var(--muted); margin-top: 8px; }
.hero-cta { display: grid; gap: 8px; justify-items: end; text-align: right; }
.hero-cta .hint { font-size: 13px; color: var(--muted); max-width: 30ch; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .hero-cta { justify-items: stretch; text-align: left; } .hero-cta .btn { width: 100%; } }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.stat { background: var(--surface); padding: 16px 18px; display: grid; gap: 4px; min-width: 0; }
.stat-label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat-label svg { width: 14px; height: 14px; color: var(--faint); }
.stat-value { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat-value small { font-size: 14px; font-weight: 500; color: var(--faint); }

  Object.freeze(vocabulary);

  // Pairs a learner could reasonably confuse even though their translations differ.

  const isValidId = id => BY_ID.has(id);
  const word = id => BY_ID.get(id);

  /* Conflict map: entries whose translations are identical or contain one another
     (e.g. "защита" / "защита интеллектуальных прав") never appear together as options or on one Match board. */
  const normRu = s => ' ' + s.toLowerCase().replace(/[.,;:()]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const CONFLICTS = new Map(ALL_IDS.map(id => [id, new Set()]));
  for (let i = 0; i < vocabulary.length; i++) {
    for (let j = i + 1; j < vocabulary.length; j++) {

      const ra = normRu(a.russian), rb = normRu(b.russian);
      const partsA = a.russian.split(',').map(p => normRu(p)), partsB = b.russian.split(',').map(p => normRu(p));

  const conflicts = (a, b) => CONFLICTS.get(a).has(b);

  /* =========================================================
     2. UTILITIES
     ========================================================= */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pct = (n, d) => d > 0 ? Math.round((n / d) * 100) : 0;
  const clampInt = (n, min, max) => Math.min(max, Math.max(min, Math.round(n)));
  const wordCount = s => s.trim().split(/\s+/).length;
  const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const normalizeAnswer = s => String(s).toLowerCase().replace(/[‘’ʼ`]/g, "'").replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ').trim().replace(/[.!?;,]+$/, '').trim();
  const acceptedAnswers = id => [word(id).english].concat(ALTERNATIVES[id] || []).map(normalizeAnswer);
  function levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     3. PERSISTENCE (localStorage with graceful fallback)
     ========================================================= */
  const STORE_KEY = 'innovation-vocab:v1';
  const SCHEMA = 1;
  const Storage = (function () {
    let available = false;
    try { const k = '__vocab_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); available = true; } catch (e) { available = false; }
    return {
      get available() { return available; },
      load() { if (!available) return null; try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
      save(data) { if (!available) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { available = false; } },
      clear() { if (!available) return; try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }
    };
  })();

  const REVIEW_STEPS = 4;                                  // correct spaced answers needed to clear a word
  const REVIEW_INTERVALS = [0, 10 * 60e3, 12 * 3600e3, 2 * 86400e3];
  const MASTERED_RUN = 3;
  const MODES = ['flashcards', 'learn', 'write', 'match'];
  const TASK_KINDS = ['tf', 'match', 'mc-en', 'mc-ru', 'type-en', 'type-ru'];
  const TASK_LABEL = { tf: 'True or False', match: 'Match pairs', 'mc-en': 'Choose the English expression', 'mc-ru': 'Choose the Russian translation', 'type-en': 'Type the English expression', 'type-ru': 'Type the Russian translation' };
  const TEST_TYPES = [
    ['combined', 'Combined', 'Every task type mixed in one test.'],
    ['tf', 'True or False', 'Decide whether a translation is right.'],
    ['match', 'Match pairs', 'Connect 4 expressions with their translations.'],
    ['mc-en', 'Choose the English expression', 'Russian prompt, pick the English.'],
    ['mc-ru', 'Choose the Russian translation', 'English prompt, pick the Russian.'],
    ['type-en', 'Type the English expression', 'Russian prompt, type the English.'],
    ['type-ru', 'Type the Russian translation', 'English prompt, type the Russian.']
  ];
  const TEST_TYPE_IDS = TEST_TYPES.map(t => t[0]);
  const testTypeName = id => (TEST_TYPES.find(t => t[0] === id) || TEST_TYPES[0])[1];
  const NAME_RE = /^[\p{L}][\p{L}\p{M}'’ .-]{0,39}$/u;
  const cleanName = v => typeof v === 'string' ? v.replace(/\s+/g, ' ').trim().slice(0, 40) : '';
  const defaultTestConfig = () => ({ count: 20, type: 'combined', timer: 'off', minutes: 10, seconds: 30, feedback: 'end' });
  const asObj = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  function sanitizeTestConfig(c) {
    c = asObj(c); const d = defaultTestConfig();
    const int = (v, min, max, def) => { const n = Number(v); return Number.isInteger(n) && n >= min && n <= max ? n : def; };
    return { count: int(c.count, 1, TOTAL, Math.min(d.count, TOTAL)), type: TEST_TYPE_IDS.includes(c.type) ? c.type : d.type,
      timer: ['off', 'total', 'per'].includes(c.timer) ? c.timer : d.timer, minutes: int(c.minutes, 1, 180, d.minutes),
      seconds: int(c.seconds, 5, 600, d.seconds), feedback: 'end' };
  }
  const PALETTES = [
    ['purple', 'Purple', '#4F46E5', 'light'], ['white', 'White', '#18181B', 'light'], ['burgundy', 'Burgundy', '#7A1E2C', 'light'], ['sakura', 'Sakura', '#C93A6E', 'light'],
    ['ocean', 'Ocean', '#0B6BCB', 'light'], ['forest', 'Forest', '#2F6B45', 'light'], ['sand', 'Sand', '#9A6A2F', 'light'],
    ['midnight', 'Midnight', '#8A90FF', 'dark'], ['graphite', 'Graphite', '#3F3F46', 'dark'], ['emerald-night', 'Emerald Night', '#34D399', 'dark'], ['ruby-night', 'Ruby Night', '#F0506E', 'dark'],
    ['deep-ocean', 'Deep Ocean', '#38BDF8', 'dark'], ['amethyst', 'Amethyst', '#C084FC', 'dark'], ['amber-night', 'Amber Night', '#FBBF24', 'dark']
  ];
  const defaultState = () => ({ version: SCHEMA, words: {}, review: {}, days: {}, totals: { correct: 0, wrong: 0, sessions: 0 }, settings: { dailyGoal: 10, palette: 'purple', testName: { first: '', last: '' }, testConfig: defaultTestConfig() }, sessions: {}, test: null, testHistory: [] });
  const nn = v => (typeof v === 'number' && Number.isFinite(v) && v >= 0) ? v : 0;
  const GOALS = [0, 5, 10, 15, 20, 30];

  function sanitize(raw) {
    const s = defaultState();
    if (!raw || typeof raw !== 'object') return s;
    const obj = (o) => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
    Object.entries(obj(raw.words)).forEach(([k, w]) => {
      const id = Number(k); if (!isValidId(id) || !w || typeof w !== 'object') return;
      s.words[id] = { seen: nn(w.seen), correct: nn(w.correct), wrong: nn(w.wrong), run: nn(w.run), last: nn(w.last) };
    });
    Object.entries(obj(raw.review)).forEach(([k, r]) => {
      const id = Number(k); if (!isValidId(id) || !r || typeof r !== 'object') return;
      s.review[id] = { mistakes: nn(r.mistakes), level: Math.min(REVIEW_STEPS - 1, nn(r.level)), priority: Math.min(10, nn(r.priority)), due: nn(r.due), flagged: !!r.flagged, added: nn(r.added) || Date.now() };
    });
    Object.entries(obj(raw.days)).forEach(([k, d]) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !d || typeof d !== 'object') return;
      const ids = Array.isArray(d.ids) ? Array.from(new Set(d.ids.map(Number).filter(isValidId))) : [];
      s.days[k] = { ids, answered: nn(d.answered), correct: nn(d.correct), wrong: nn(d.wrong) };
    });
    const t = obj(raw.totals);
    s.totals = { correct: nn(t.correct), wrong: nn(t.wrong), sessions: nn(t.sessions) };
    const goal = Number(obj(raw.settings).dailyGoal);
    s.settings.dailyGoal = GOALS.includes(goal) ? goal : 10;
    s.settings.testConfig = sanitizeTestConfig(obj(raw.settings).testConfig);
    const tn = obj(obj(raw.settings).testName); s.settings.testName = { first: cleanName(tn.first), last: cleanName(tn.last) };
    const pal = obj(raw.settings).palette; s.settings.palette = PALETTES.some(x => x[0] === pal) ? pal : 'purple';
    s.test = sanitizeTest(raw.test);
    s.testHistory = (Array.isArray(raw.testHistory) ? raw.testHistory : []).filter(e => e && typeof e === 'object').slice(0, 20).map(e => ({
      at: nn(e.at), count: Math.min(TOTAL, nn(e.count)), type: TEST_TYPE_IDS.includes(e.type) ? e.type : 'combined', percent: Math.min(100, nn(e.percent)),
      points: Math.min(3, nn(e.points)), student: String(e.student || '').slice(0, 81), timeMs: nn(e.timeMs), timer: String(e.timer || '').slice(0, 40), leaves: nn(e.leaves), reason: String(e.reason || 'done').slice(0, 10) }));
    Object.entries(obj(raw.sessions)).forEach(([mode, sess]) => {
      const clean = sanitizeSession(mode, sess); if (clean) s.sessions[mode] = clean;
    });
    return s;
  }
  function sanitizeTest(t) {
    if (!t || typeof t !== 'object' || !Array.isArray(t.tasks) || !t.tasks.length || t.tasks.length > TOTAL) return null;
    const ids = a => Array.isArray(a) && a.length > 0 && a.every(isValidId);
    const tasks = [];
    for (const k of t.tasks) {
      if (!k || !TASK_KINDS.includes(k.kind) || !isValidId(k.id)) return null;
      const c = { kind: k.kind, id: k.id };
      if (k.kind === 'tf') { if (!isValidId(k.shown)) return null; c.shown = k.shown; c.truth = k.shown === k.id; }
      if (k.kind === 'mc-en' || k.kind === 'mc-ru') { if (!ids(k.options) || !k.options.includes(k.id)) return null; c.options = k.options.slice(0, 4); }

        if (!ids(k.ids) || !k.ids.includes(k.id) || !ids(k.left) || !ids(k.right)) return null;
        c.ids = k.ids.slice(0, 6); c.left = k.left.filter(x => c.ids.includes(x)); c.right = k.right.filter(x => c.ids.includes(x));

        c.pairs = {}; const used = new Set();
        Object.entries(asObj(k.pairs)).forEach(([en, r]) => { const e2 = Number(en); if (c.ids.includes(e2) && c.ids.includes(r) && !used.has(r)) { c.pairs[e2] = r; used.add(r); } });

      const i = Number(k);

      }
    });
    const sel = t.sel;
    const st = asObj(t.student);
    return { student: { first: cleanName(st.first), last: cleanName(st.last) }, config: sanitizeTestConfig(t.config), tasks, index: clampInt(nn(t.index), 0, tasks.length - 1), answers, startedAt: nn(t.startedAt) || Date.now(),
      deadline: t.deadline ? nn(t.deadline) : null, qDeadline: t.qDeadline ? nn(t.qDeadline) : null, leaves: nn(t.leaves),
      sel: (typeof sel === 'boolean' || isValidId(sel)) ? sel : null, draft: typeof t.draft === 'string' ? t.draft.slice(0, 120) : '' };
  }
  function sanitizeSession(mode, sess) {
    if (!MODES.includes(mode) || !sess || typeof sess !== 'object' || !Array.isArray(sess.ids)) return null;
    const ids = sess.ids.map(Number).filter(isValidId);
    if (!ids.length || new Set(ids).size !== ids.length) return null;
    const s = { mode, ids, index: clampInt(nn(sess.index), 0, ids.length - 1), results: {}, startedAt: nn(sess.startedAt) || Date.now(), updatedAt: nn(sess.updatedAt) || Date.now(), source: String(sess.source || 'all'), retry: !!sess.retry };
    Object.entries(sess.results && typeof sess.results === 'object' ? sess.results : {}).forEach(([k, v]) => {
      const id = Number(k); if (ids.includes(id) && ['correct', 'wrong', 'skipped', 'know', 'practice'].includes(v)) s.results[id] = v;
    });
    if (mode === 'flashcards' && sess.current && typeof sess.current === 'object') {
      const c = sess.current;
      if (c.id === ids[s.index] && ['front', 'typing', 'done'].includes(c.stage))
        s.current = { id: c.id, stage: c.stage, value: typeof c.value === 'string' ? c.value.slice(0, 120) : '', outcome: ['know', 'wrong', 'practice'].includes(c.outcome) ? c.outcome : null, close: !!c.close };
      if (s.current && s.current.stage === 'done' && !s.current.outcome) s.current.stage = 'front';
    }
    if (mode === 'learn' && sess.current && typeof sess.current === 'object') {
      const c = sess.current, opts = Array.isArray(c.options) ? c.options.map(Number) : [];
      if (c.id === ids[s.index] && opts.includes(c.id) && opts.every(isValidId) && new Set(opts).size === opts.length)
        s.current = { id: c.id, options: opts, picked: isValidId(Number(c.picked)) && opts.includes(Number(c.picked)) ? Number(c.picked) : null };
    }
    if (mode === 'match') {
      const rounds = Array.isArray(sess.rounds) ? sess.rounds.map(r => Array.isArray(r) ? r.map(Number).filter(id => ids.includes(id)) : []).filter(r => r.length) : [];
      const flat = rounds.flat();
      if (!rounds.length || flat.length !== ids.length || new Set(flat).size !== flat.length) return null;
      s.rounds = rounds;
      s.round = clampInt(nn(sess.round), 0, rounds.length - 1);
      const cur = rounds[s.round];
      const sameSet = a => Array.isArray(a) && a.length === cur.length && a.map(Number).every(id => cur.includes(id));
      s.left = sameSet(sess.left) ? sess.left.map(Number) : shuffle(cur);
      s.right = sameSet(sess.right) ? sess.right.map(Number) : shuffle(cur);
      s.matched = Array.isArray(sess.matched) ? sess.matched.map(Number).filter(id => cur.includes(id)) : [];
      s.roundWrong = Array.isArray(sess.roundWrong) ? sess.roundWrong.map(Number).filter(id => cur.includes(id)) : [];
      s.wrongIds = Array.isArray(sess.wrongIds) ? sess.wrongIds.map(Number).filter(id => ids.includes(id)) : [];
      s.mistakes = nn(sess.mistakes);
      s.elapsed = nn(sess.elapsed);
      if (s.matched.length >= cur.length) return null;
    }
    return s;
  }

  let state = sanitize(Storage.load());
  function save() { Storage.save(state); }

  /* =========================================================
     4. LEARNING MODEL: stats, review scheduling, streaks
     ========================================================= */

  const wordStats = id => state.words[id] || (state.words[id] = { seen: 0, correct: 0, wrong: 0, run: 0, last: 0 });
  function today() { const k = dayKey(); return state.days[k] || (state.days[k] = { ids: [], answered: 0, correct: 0, wrong: 0 }); }
  function touchDay(id) { const d = today(); d.answered++; if (!d.ids.includes(id)) d.ids.push(id); return d; }
  function ensureReview(id) {
    return state.review[id] || (state.review[id] = { mistakes: 0, level: 0, priority: 0, due: Date.now(), flagged: false, added: Date.now() });
  }
  // Correct answer on a review word advances it only when due, so clearing requires spaced repetitions.
  function advanceReview(id) {
    const r = state.review[id]; if (!r) return;
    const now = Date.now();
    r.priority = Math.max(0, r.priority - 1);
    if (r.due > now) return;
    r.level++;
    if (r.level >= REVIEW_STEPS) { delete state.review[id]; return 'cleared'; }
    r.due = now + REVIEW_INTERVALS[r.level];
  }
  function recordAnswer(id, correct, silent) {
    const w = wordStats(id), d = touchDay(id), now = Date.now();
    w.seen++; w.last = now;
    let cleared;
    if (correct) {
      w.correct++; w.run++; state.totals.correct++; d.correct++;
      cleared = advanceReview(id);
    } else {
      w.wrong++; w.run = 0; state.totals.wrong++; d.wrong++;
      const r = ensureReview(id);
      r.mistakes++; r.level = 0; r.due = now;
      r.priority = Math.min(10, r.priority + (r.mistakes >= 3 ? 3 : 2));
    }
    save();
    if (cleared && !silent) toast('“' + word(id).english + '” cleared from review');
  }
  function markKnow(id) {
    const w = wordStats(id); touchDay(id); w.seen++; w.run++; w.last = Date.now();
    const cleared = advanceReview(id); save();
    if (cleared) toast('“' + word(id).english + '” cleared from review');
  }
  function markPractice(id) {
    const w = wordStats(id); touchDay(id); w.seen++; w.run = 0; w.last = Date.now();
    const r = ensureReview(id); r.flagged = true; r.level = 0; r.due = Date.now(); r.priority = Math.min(10, r.priority + 1);
    save();
  }

  function wordStatus(id) {
    if (state.review[id]) return 'review';
    const w = state.words[id];
    if (!w || !w.seen) return 'new';
    return w.run >= MASTERED_RUN ? 'mastered' : 'learning';
  }
  const STATUS_CHIP = { new: ['New', ''], learning: ['Learning', 'chip-accent'], review: ['In review', 'chip-warn'], mastered: ['Mastered', 'chip-ok'] };
  function metrics() {
    let studied = 0, mastered = 0;
    ALL_IDS.forEach(id => { const w = state.words[id]; if (w && w.seen) studied++; if (wordStatus(id) === 'mastered') mastered++; });
    const answered = state.totals.correct + state.totals.wrong;
    return { studied, mastered, accuracy: pct(state.totals.correct, answered), answered, streak: streak(), todayCount: (state.days[dayKey()] || { ids: [] }).ids.length, reviewCount: Object.keys(state.review).length, dueCount: reviewList().filter(r => r.isDue).length };
  }
  function streak() {
    const d = new Date(); d.setHours(12, 0, 0, 0);
    const active = k => state.days[k] && state.days[k].answered > 0;
    if (!active(dayKey(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (active(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }

  }

    const now = Date.now();

      .filter(r => isValidId(r.id))
      .sort((a, b) => (b.isDue - a.isDue) || (b.priority - a.priority) || (b.mistakes - a.mistakes) || (a.due - b.due));
  }
  function reviewStatus(r) {
    if (r.level === 0) return r.mistakes >= 3 ? ['Struggling', 'chip-bad'] : (r.mistakes === 0 && r.flagged ? ['Flagged', 'chip-warn'] : ['Needs work', 'chip-warn']);

    const ms = r.due - Date.now();

    if (ms < 3600e3) return 'In ' + Math.max(1, Math.round(ms / 60e3)) + ' min';
    if (ms < 86400e3) return 'In ' + Math.round(ms / 3600e3) + ' h';
    return 'In ' + Math.round(ms / 86400e3) + ' d';

  /* =========================================================
     5. SESSION ENGINE (shared by every mode)
     ========================================================= */
  const MODE_INFO = {
    flashcards: { title: 'Flashcards', desc: 'Say if you know a word, then prove it by typing the translation.' },
    learn: { title: 'Learn', desc: 'Read a Russian translation and choose the English expression.' },
    write: { title: 'Write', desc: 'Type the English expression from memory.' },
    match: { title: 'Match', desc: 'Pair English expressions with translations against the clock.' }
  };

  function pickDistractors(id, n, field) {
    field = field || 'english';
    const target = wordCount(word(id)[field]);
    const candidates = shuffle(ALL_IDS.filter(o => o !== id && !conflicts(id, o)))
      .sort((a, b) => Math.abs(wordCount(word(a)[field]) - target) - Math.abs(wordCount(word(b)[field]) - target));
    return shuffle(candidates.slice(0, Math.max(n, 8))).slice(0, n);
  }
  function buildRounds(ids) {
    const pool = ids.slice(), rounds = [];
    let size = 4;
    while (pool.length) {
      const round = [];
      for (let i = 0; i < pool.length && round.length < size;) {
        if (round.some(r => conflicts(r, pool[i]))) { i++; continue; }
        round.push(pool.splice(i, 1)[0]);
      }
      rounds.push(round);
      size = Math.min(size + 1, 8);
    }
    // Fold a tiny last round into the previous one when no conflicts arise.
    if (rounds.length > 1) {
      const last = rounds[rounds.length - 1], prev = rounds[rounds.length - 2];
      if (last.length < 3 && prev.length + last.length <= 10 && !last.some(a => prev.some(b => conflicts(a, b)))) {
        prev.push(...last); rounds.pop();
      }
    }
    return rounds;
  }
  function prepareRound(s) {
    const cur = s.rounds[s.round];
    s.left = shuffle(cur); s.right = shuffle(cur); s.matched = []; s.roundWrong = [];
  }
  function selectIds(source, count) {
    if (source === 'difficult') return reviewList().map(r => r.id);
    if (source === 'random') return shuffle(ALL_IDS).slice(0, Math.min(10, TOTAL));
    if (source === 'custom') {
      // Least practised first: unseen, then low streak, then oldest.
      const ranked = shuffle(ALL_IDS).sort((a, b) => {
        const wa = state.words[a] || { seen: 0, run: 0, last: 0 }, wb = state.words[b] || { seen: 0, run: 0, last: 0 };
        return (Math.min(wa.seen, 1) - Math.min(wb.seen, 1)) || (wa.run - wb.run) || (wa.last - wb.last);
      });

    return ALL_IDS.slice();
  }
  function startSession(mode, ids, opts) {
    opts = opts || {};

    const s = { mode, ids: opts.keepOrder ? ids : shuffle(ids), index: 0, results: {}, startedAt: Date.now(), updatedAt: Date.now(), source: opts.source || 'all', retry: !!opts.retry };
    if (mode === 'match') { s.rounds = buildRounds(s.ids); s.round = 0; s.wrongIds = []; s.mistakes = 0; s.elapsed = 0; prepareRound(s); s.ids = s.rounds.flat(); }
    state.sessions[mode] = s;
    delete ui.completion[mode];
    ui.flipped = false; ui.writeError = ''; ui.matchSel = { en: null, ru: null }; ui.matchTick = Date.now();

  }
  function touch(s) { s.updatedAt = Date.now(); save(); }
  function completeSession(mode) {
    const s = state.sessions[mode]; if (!s) return;
    if (mode === 'match') commitMatchTime(s);
    const vals = s.ids.map(id => s.results[id]);
    const summary = {
      mode, total: s.ids.length, source: s.source, ids: s.ids.slice(),
      correct: vals.filter(v => v === 'correct').length,
      wrong: vals.filter(v => v === 'wrong').length,
      skipped: vals.filter(v => v === 'skipped').length,
      know: vals.filter(v => v === 'know').length,
      practice: vals.filter(v => v === 'practice').length,
      unanswered: vals.filter(v => v === undefined).length,
      mistakeIds: s.ids.filter(id => s.results[id] === 'wrong' || s.results[id] === 'skipped'),
      practiceIds: s.ids.filter(id => s.results[id] === 'practice')

    if (mode === 'match') { summary.time = s.elapsed; summary.mistakes = s.mistakes; summary.mistakeIds = s.wrongIds.slice(); summary.rounds = s.rounds.length; }

  /* ---- Mode router: completion → active session → setup ---- */
  function viewMode(mode) {

  function viewSetup(mode) {
    const diffCount = Object.keys(state.review).length;
    const choice = ui.setupChoice && ui.setupChoice[mode] || 'all';
    const option = (value, title, count, desc, disabled) =>
      '<label class="choice"><input type="radio" name="source" value="' + value + '"' + (choice === value && !disabled ? ' checked' : '') + (disabled ? ' disabled' : '') + '>' +
      '<span class="choice-title">' + title + (count !== null ? '<span class="count">' + count + '</span>' : '') + '</span><span class="choice-desc">' + desc + '</span>' +
      (value === 'custom' ? '<span class="custom-row"><label for="custom-count" class="small muted">Words</label><input class="input input-sm num" type="number" id="custom-count" name="count" min="1" max="' + TOTAL + '" step="1" inputmode="numeric" value="' + (ui.customCount || 15) + '"></span>' : '') + '</label>';
    return pageHead(MODE_INFO[mode].title, esc(MODE_INFO[mode].desc)) +
      '<form class="panel panel-pad" id="setup-form" data-mode="' + mode + '" novalidate style="display:grid;gap:20px">' +
        '<fieldset class="choices"><legend>Choose what to study</legend>' +
          option('all', 'All vocabulary', TOTAL, 'Every entry, shuffled.') +
          option('difficult', 'Only difficult words', diffCount, diffCount ? 'Words in your review list, most troublesome first.' : 'No difficult words yet. Mistakes will appear here.', !diffCount) +
          option('custom', 'Custom number', null, 'Pick how many; words you know least come first.') +
          option('random', 'Random selection', Math.min(10, TOTAL), '10 random entries for a quick round.') +
        '</fieldset>' +
        (ui.setupError ? '<p class="error" role="alert">' + esc(ui.setupError) + '</p>' : '') +
        '<div class="btn-row"><button type="submit" class="btn btn-primary btn-lg">Start ' + MODE_INFO[mode].title + ' ' + icon('arrow') + '</button></div>' +
      '</form>';
  }

  function sessionTop(s, current, total, extraRight) {
    return '<div class="stage-top"><div class="stage-meta"><span><strong class="num">' + current + '</strong> <span class="num">/ ' + total + '</span>' + (s.source === 'difficult' ? ' · Difficult words' : s.retry ? ' · Retrying mistakes' : '') + '</span>' +
      '<span class="btn-row">' + (extraRight || '') + '<button type="button" class="btn btn-ghost btn-sm" data-action="endSession" data-mode="' + s.mode + '">End session</button></span></div>' +
      progressBar(Math.min(current, total), total, 'Session progress') + '</div>';
  }

  /* ---- Flashcards ---- */
  function fcCurrent(s) {
    const id = s.ids[s.index];
    if (!s.current || s.current.id !== id) s.current = { id, stage: 'front', value: '', outcome: null, close: false };
    return s.current;
  }
  function viewFlashcards(s) {
    const c = fcCurrent(s), id = c.id, w = word(id), done = c.stage === 'done';
    const rated = Object.keys(s.results).length, last = s.index === s.ids.length - 1;
    const no = '<span class="num">No. ' + String(id).padStart(2, '0') + '</span>';
    const card = '<div class="flashcard' + (done ? ' flipped' : '') + '" id="flashcard" aria-live="polite">' +
      '<span class="fc-inner"><span class="fc-face fc-front" aria-hidden="' + done + '"><span class="fc-label"><span>English</span>' + no + '</span><span class="fc-text">' + esc(w.english) + '</span><span class="fc-hint">' + (c.stage === 'typing' ? 'Type the Russian translation below' : 'Do you know the translation?') + '</span></span>' +
      '<span class="fc-face fc-back" aria-hidden="' + !done + '"><span class="fc-label"><span>Russian</span>' + no + '</span><span class="fc-text" lang="ru">' + esc(w.russian) + '</span><span class="fc-hint">' + esc(w.english) + '</span></span></span></div>';
    let below = '';
    if (c.stage === 'front') {
      below = '<div class="fc-rate"><button type="button" class="btn btn-lg btn-practice" data-action="fcPractice">' + icon('review') + 'Need Practice</button>' +
        '<button type="button" class="btn btn-lg btn-know" data-action="fcKnow" id="fc-know">' + icon('check') + 'Know It</button></div>' +
        '<p class="kbd-hint"><kbd>K</kbd> know it · <kbd>P</kbd> need practice</p>';
    } else if (c.stage === 'typing') {
      below = '<form class="fc-form" id="fc-form" novalidate autocomplete="off"><label for="fc-input" class="small muted" style="font-weight:550">Type the Russian translation</label>' +
        '<input class="input" id="fc-input" type="text" lang="ru" placeholder="Перевод на русском…" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="120" value="' + esc(c.value) + '">' +
        '<p class="error" id="fc-error" role="alert">' + esc(ui.fcError || '') + '</p>' +
        '<div class="fc-rate"><button type="button" class="btn btn-lg btn-secondary" data-action="fcPractice">Show translation</button><button type="submit" class="btn btn-lg btn-primary">Check</button></div>' +
        '<p class="small muted">For entries with several meanings, one is enough.</p></form>';
    } else {
      const fb = c.outcome === 'know'
        ? '<div class="feedback ok" role="status">' + icon('check') + '<div class="fb-body"><span class="fb-title">Correct</span><span>You wrote: <span lang="ru">' + esc(c.value) + '</span></span></div></div>'
        : c.outcome === 'wrong'
          ? '<div class="feedback bad" role="status">' + icon('x') + '<div class="fb-body"><span class="fb-title">' + (c.close ? 'Very close. Check the spelling.' : 'Not quite') + '</span><span>You wrote: “<span lang="ru">' + esc(c.value) + '</span>”. The correct translation is on the card.</span><span class="small muted">Added to your review list.</span></div></div>'
          : '<div class="feedback neutral" role="status">' + icon('review') + '<div class="fb-body"><span class="fb-title">Added to review</span><span>Read the translation on the card. You will practise this word again later.</span></div></div>';
      below = fb + '<button type="button" class="btn btn-primary btn-lg" id="fc-next" data-action="fcNext" style="width:100%">' + (last ? 'Finish' : 'Next card') + ' ' + icon('arrow') + '</button>';
    }
    return '<div class="stage">' + sessionTop(s, s.index + 1, s.ids.length, '<span class="small num">' + rated + ' done</span>') + card + below + '</div>';
  }

  /* ---- Learn (multiple choice) ---- */
  function learnCurrent(s) {
    const id = s.ids[s.index];
    if (!s.current || s.current.id !== id) { s.current = { id, options: shuffle([id].concat(pickDistractors(id, 3))), picked: null }; touch(s); }
    return s.current;
  }
  function viewLearn(s) {
    const c = learnCurrent(s), w = word(c.id), answered = c.picked !== null;
    const opts = c.options.map((oid, i) => {
      let cls = '', mark = '';
      if (answered) {
        if (oid === c.id) { cls = 'correct'; mark = icon('check'); }
        else if (oid === c.picked) { cls = 'wrong'; mark = icon('x'); }
        else cls = 'dim';
      }
      return '<button type="button" class="option ' + cls + '" data-action="learnPick" data-id="' + oid + '"' + (answered ? ' disabled' : '') + '><span class="key" aria-hidden="true">' + (i + 1) + '</span><span>' + esc(word(oid).english) + '</span><span class="mark">' + mark + (cls === 'correct' ? '<span class="sr-only">Correct answer</span>' : cls === 'wrong' ? '<span class="sr-only">Your answer</span>' : '') + '</span></button>';
    }).join('');
    let fb = '';
    if (answered) {
      const ok = c.picked === c.id;
      fb = ok
        ? '<div class="feedback ok" role="status">' + icon('check') + '<div class="fb-body"><span class="fb-title">Correct</span><span>“' + esc(w.english) + '” means ' + ru(w.russian) + '.</span></div></div>'
        : '<div class="feedback bad" role="status">' + icon('x') + '<div class="fb-body"><span class="fb-title">Not quite</span><span>The answer is <strong>' + esc(w.english) + '</strong>. You chose “' + esc(word(c.picked).english) + '”, which means ' + ru(word(c.picked).russian) + '.</span></div></div>';
      fb += '<div class="btn-row"><button type="button" class="btn btn-primary btn-lg" id="continue-btn" data-action="learnContinue" style="width:100%">Continue ' + icon('arrow') + '</button></div>';
    }
    const done = Object.keys(s.results).length, right = Object.values(s.results).filter(v => v === 'correct').length;
    return '<div class="stage">' + sessionTop(s, s.index + 1, s.ids.length, '<span class="small num">' + right + ' / ' + done + ' correct</span>') +
      '<div class="panel question"><p class="eyebrow">Choose the English expression</p><p class="q-text" lang="ru">' + esc(w.russian) + '</p></div>' +
      '<div class="options" role="group" aria-label="Answer options">' + opts + '</div>' + fb +
      (answered ? '' : '<p class="kbd-hint"><kbd>1</kbd>–<kbd>' + c.options.length + '</kbd> to choose · <kbd>Enter</kbd> to continue</p>') + '</div>';
  }

  /* ---- Write ---- */
  function writeCurrent(s) {
    const id = s.ids[s.index];
    if (!s.current || s.current.id !== id) s.current = { id, attempt: null, retry: false };
    return s.current;
  }
  function viewWrite(s) {
    const c = writeCurrent(s), w = word(c.id), a = c.attempt;
    let fb = '', inputCls = '';
    if (a) {
      inputCls = a.ok ? ' is-ok' : ' is-bad';
      if (a.ok) fb = '<div class="feedback ok" role="status">' + icon('check') + '<div class="fb-body"><span class="fb-title">' + (c.retry ? 'Correct on retry' : 'Correct') + '</span><span>' + esc(w.english) + '</span></div></div>';
      else if (a.revealed) fb = '<div class="feedback bad" role="status">' + icon('alert') + '<div class="fb-body"><span class="fb-title">Answer</span><span><strong>' + esc(w.english) + '</strong></span><span class="small muted">Added to your review list.</span></div></div>';
      else fb = '<div class="feedback bad" role="status">' + icon('x') + '<div class="fb-body"><span class="fb-title">' + (a.close ? 'Very close. Check the spelling.' : 'Not quite') + '</span><span>Correct answer: <strong>' + esc(w.english) + '</strong></span><span class="small muted">You wrote: “' + esc(a.value) + '”</span></div></div>';
    }
    const actions = !a
      ? '<button type="submit" class="btn btn-primary btn-lg">Check Answer</button><button type="button" class="btn btn-ghost btn-lg" data-action="writeShow">Show answer</button>'
      : (a.ok || a.revealed
        ? '<button type="button" class="btn btn-primary btn-lg" id="continue-btn" data-action="writeContinue">Continue ' + icon('arrow') + '</button>' + (a.revealed ? '<button type="button" class="btn btn-secondary btn-lg" data-action="writeRetry">Type it now</button>' : '')
        : '<button type="button" class="btn btn-secondary btn-lg" id="retry-btn" data-action="writeRetry">' + icon('restart') + 'Try again</button><button type="button" class="btn btn-primary btn-lg" data-action="writeContinue">Continue ' + icon('arrow') + '</button>');
    const done = Object.keys(s.results).length, right = Object.values(s.results).filter(v => v === 'correct').length;
    return '<div class="stage">' + sessionTop(s, s.index + 1, s.ids.length, '<span class="small num">' + right + ' / ' + done + ' correct</span>') +
      '<div class="panel question"><p class="eyebrow">Type the English expression</p><p class="q-text" lang="ru">' + esc(w.russian) + '</p><p class="small muted">' + plural(wordCount(w.english), 'word') + '</p></div>' +
      '<form id="write-form" class="field" novalidate autocomplete="off"><label for="write-input">Your answer</label>' +
        '<input class="input' + inputCls + '" id="write-input" name="answer" type="text" placeholder="Type the English expression…" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="120"' + (a ? ' readonly value="' + esc(a.value) + '"' : '') + ' aria-describedby="write-error">' +
        '<p class="error" id="write-error" role="alert">' + esc(ui.writeError || '') + '</p>' + fb +
        '<div class="btn-row">' + actions + '</div></form></div>';
  }

  /* ---- Match ---- */
  function matchElapsed(s) { return s.elapsed + (Date.now() - ui.matchTick); }
  function commitMatchTime(s) { s.elapsed = matchElapsed(s); ui.matchTick = Date.now(); }
  function viewMatch(s) {
    const cur = s.rounds[s.round], sel = ui.matchSel, flash = ui.matchFlash || {};
    const tile = (side, id) => {
      const matched = s.matched.includes(id), selected = sel[side] === id, flashing = flash[side] === id;
      const text = side === 'en' ? esc(word(id).english) : ru(word(id).russian);
      return '<button type="button" class="tile' + (matched ? ' matched' : '') + (flashing ? ' flash' : '') + '" data-action="matchPick" data-side="' + side + '" data-id="' + id + '" aria-pressed="' + selected + '"' + (matched ? ' disabled' : '') + '>' + text + (matched ? '<span class="sr-only"> (matched)</span>' : '') + '</button>';
    };
    const before = s.rounds.slice(0, s.round).flat().length;
    return '<div class="stage" style="max-width:820px">' +
      '<div class="stage-top"><div class="match-head"><span class="small muted">Round <strong class="num" style="color:var(--text)">' + (s.round + 1) + '</strong> of ' + s.rounds.length + ' · ' + plural(cur.length, 'pair') + '</span>' +
      '<div class="match-stats"><span>' + icon('clock', '') .replace('<svg', '<svg style="width:15px;height:15px;vertical-align:-2px;margin-right:4px"') + '<b id="match-time">' + fmtTime(matchElapsed(s)) + '</b></span><span>Pairs <b>' + (before + s.matched.length) + '/' + s.ids.length + '</b></span><span>Mistakes <b>' + s.mistakes + '</b></span></div></div>' +
      progressBar(before + s.matched.length, s.ids.length, 'Pairs matched') + '</div>' +
      '<div class="match-grid"><div class="match-col" role="group" aria-labelledby="col-en"><h3 id="col-en">English</h3>' + s.left.map(id => tile('en', id)).join('') + '</div>' +
      '<div class="match-col" role="group" aria-labelledby="col-ru"><h3 id="col-ru">Russian</h3>' + s.right.map(id => tile('ru', id)).join('') + '</div></div>' +
      '<div class="btn-row center"><button type="button" class="btn btn-ghost btn-sm" data-action="matchRestart">' + icon('restart') + 'Restart</button><button type="button" class="btn btn-ghost btn-sm" data-action="endSession" data-mode="match">End session</button></div>' +
      '<p class="kbd-hint">Select one item in each column. <kbd>Tab</kbd> to move, <kbd>Enter</kbd> to select.</p></div>';
  }

  /* ---- Completion ---- */
  function viewCompletion(mode, sum) {
    let statsHtml = '', title = 'Session complete', note = '', actions = '';
    const box = (v, l) => '<div><b>' + v + '</b><span>' + l + '</span></div>';
    if (mode === 'flashcards') {
      const missed = sum.ids.filter(x => sum.practiceIds.includes(x) || sum.mistakeIds.includes(x));
      statsHtml = box(sum.know, 'Knew it') + box(sum.wrong, 'Typed wrong') + box(sum.practice, 'Need practice');
      note = missed.length ? plural(missed.length, 'word') + ' added to your review list.' : 'You knew every card.';
      actions = (missed.length ? '<button type="button" class="btn btn-primary" data-action="studyIds" data-mode="flashcards" data-ids="' + missed.join(',') + '">' + icon('restart') + 'Study missed cards</button>' : '') +
        '<button type="button" class="btn ' + (missed.length ? 'btn-secondary' : 'btn-primary') + '" data-action="studyIds" data-mode="flashcards" data-ids="' + sum.ids.join(',') + '">' + icon('restart') + 'Restart</button>' +
        '<button type="button" class="btn btn-secondary" data-action="go" data-route="learn">Try Learn mode</button>';
    } else if (mode === 'match') {
      statsHtml = box(fmtTime(sum.time), 'Time') + box(sum.total, 'Pairs') + box(sum.mistakes, 'Mistakes');
      note = sum.mistakes ? 'Words you mismatched were added to review.' : 'A clean board. No mismatches.';
      actions = '<button type="button" class="btn btn-primary" data-action="studyIds" data-mode="match" data-ids="' + sum.ids.join(',') + '">' + icon('restart') + 'Play again</button>' +
        '<button type="button" class="btn btn-secondary" data-action="newSetup" data-mode="match">New selection</button>';
    } else {
      const answered = sum.correct + sum.wrong + sum.skipped;
      title = sum.wrong + sum.skipped === 0 ? 'Perfect score' : 'Session complete';
      statsHtml = box(sum.correct + '/' + sum.total, 'Correct') + box(pct(sum.correct, answered) + '%', 'Accuracy') + box(sum.wrong + sum.skipped, 'Mistakes');
      actions = (sum.mistakeIds.length ? '<button type="button" class="btn btn-primary" data-action="retryMistakes" data-mode="' + mode + '">' + icon('restart') + 'Retry ' + plural(sum.mistakeIds.length, 'mistake') + '</button>' : '') +
        '<button type="button" class="btn ' + (sum.mistakeIds.length ? 'btn-secondary' : 'btn-primary') + '" data-action="newSetup" data-mode="' + mode + '">New session</button>';
    }
    actions += '<button type="button" class="btn btn-ghost" data-action="go" data-route="home">Home</button>';
    const mistakes = (mode === 'learn' || mode === 'write' || mode === 'match') && sum.mistakeIds.length
      ? '<div class="mistake-list section"><div class="section-head"><h2>Mistakes</h2><span class="small muted">Added to review</span></div><div class="panel">' + wordRows(sum.mistakeIds) + '</div></div>' : '';
    return '<div class="stage"><div class="panel done"><div class="done-badge">' + icon('check') + '</div><div style="display:grid;gap:6px"><h2 id="page-title" tabindex="-1">' + title + '</h2><p class="muted">' + MODE_INFO[mode].title + (note ? ' · ' + esc(note) : '') + '</p></div>' +
      '<div class="done-stats num">' + statsHtml + '</div><div class="btn-row center">' + actions + '</div></div>' + mistakes + '</div>';
  }

  /* ---- Review ---- */
  function viewReview() {
    const list = reviewList(), due = list.filter(r => r.isDue).length;
    if (!list.length) return pageHead('Review', 'Your personal list of difficult words.') +
      '<div class="panel">' + emptyState('check', 'Your review list is empty', 'Answer a question incorrectly, fail a typing challenge, or mark a flashcard “Need practice”, and the word will show up here with its own review schedule.', '<button type="button" class="btn btn-primary" data-action="go" data-route="learn">Start a Learn session</button>') + '</div>';
    const rows = list.map(r => { const w = word(r.id), st = reviewStatus(r);
      return '<tr><td class="en">' + esc(w.english) + '</td><td class="ru">' + ru(w.russian) + '</td><td class="num">' + r.mistakes + '</td><td><span class="chip ' + st[1] + '">' + st[0] + '</span></td><td><span class="chip' + (r.isDue ? ' chip-warn' : '') + '">' + dueLabel(r) + '</span></td></tr>'; }).join('');
    return pageHead('Review', plural(list.length, 'word') + ' in review · ' + due + ' due now. Each word needs ' + REVIEW_STEPS + ' spaced correct answers to clear.') +
      '<section class="panel panel-pad" style="display:grid;gap:14px" aria-labelledby="practice-h"><h2 id="practice-h" style="font-size:15px;font-weight:600">Practise these words</h2><p class="small muted">Sessions use your review words only, highest priority first.</p>' +
        '<div class="btn-row"><button type="button" class="btn btn-primary" data-action="reviewPractice" data-mode="learn">' + icon('learn') + 'Multiple choice</button><button type="button" class="btn btn-secondary" data-action="reviewPractice" data-mode="write">' + icon('write') + 'Typing</button><button type="button" class="btn btn-secondary" data-action="reviewPractice" data-mode="flashcards">' + icon('cards') + 'Flashcards</button></div></section>' +
      '<div class="panel table-wrap"><table><caption class="sr-only">Words in review</caption><thead><tr><th scope="col">English</th><th scope="col">Russian</th><th scope="col">Mistakes</th><th scope="col">Status</th><th scope="col">Next review</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ---- Progress + Settings ---- */
  function viewProgress() {
    const m = metrics();
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i); days.push(d); }
    const counts = days.map(d => (state.days[dayKey(d)] || { answered: 0 }).answered);
    const max = Math.max(1, ...counts);
    const chart = days.map((d, i) => '<div class="chart-col"><div class="chart-bar-wrap"><div class="chart-bar' + (i === 13 ? ' today' : '') + (counts[i] ? '' : ' zero') + '" style="height:' + (counts[i] ? Math.max(6, counts[i] / max * 100) : 2) + '%" title="' + counts[i] + ' answers"></div></div><span class="chart-day">' + 'SMTWTFS'[d.getDay()] + '</span></div>').join('');
    const filter = ui.progressFilter;
    const counts2 = { all: TOTAL, new: 0, learning: 0, review: 0, mastered: 0 };
    ALL_IDS.forEach(id => counts2[wordStatus(id)]++);
    const filters = [['all', 'All'], ['new', 'New'], ['learning', 'Learning'], ['review', 'In review'], ['mastered', 'Mastered']].map(([k, l]) =>
      '<button type="button" class="filter" data-action="setFilter" data-filter="' + k + '" aria-pressed="' + (filter === k) + '">' + l + ' <span class="num">' + counts2[k] + '</span></button>').join('');
    const ids = ALL_IDS.filter(id => filter === 'all' || wordStatus(id) === filter);
    const rows = ids.map(id => { const w = word(id), st = STATUS_CHIP[wordStatus(id)], ws = state.words[id], tot = ws ? ws.correct + ws.wrong : 0;
      return '<tr><td class="id">' + String(id).padStart(2, '0') + '</td><td class="en">' + esc(w.english) + '</td><td class="ru">' + ru(w.russian) + '</td><td><span class="chip ' + st[1] + '">' + st[0] + '</span></td><td class="num">' + (tot ? pct(ws.correct, tot) + '%' : '–') + '</td></tr>'; }).join('');
    const goalOpts = GOALS.map(g => '<option value="' + g + '"' + (state.settings.dailyGoal === g ? ' selected' : '') + '>' + (g ? g + ' words per day' : 'Off') + '</option>').join('');
    const goal = state.settings.dailyGoal;
    return pageHead('Progress', 'Everything here is calculated from your own study history.') +
      '<section class="stats" aria-label="Summary">' + stat('book', 'Words studied', m.studied, '/ ' + TOTAL) + stat('star', 'Mastered', m.mastered) + stat('learn', 'Accuracy', m.answered ? m.accuracy + '%' : '–') + stat('flame', 'Streak', m.streak, m.streak === 1 ? 'day' : 'days') + '</section>' +
      (goal ? '<section class="panel panel-pad overall"><div class="overall-top"><h2 style="font-size:15px;font-weight:600">Today’s goal</h2><span class="muted num">' + m.todayCount + ' of ' + goal + ' words' + (m.todayCount >= goal ? ' · Goal reached' : '') + '</span></div>' + progressBar(Math.min(m.todayCount, goal), goal, 'Daily goal') + '</section>' : '') +
      '<section class="panel panel-pad" style="display:grid;gap:12px" aria-labelledby="act-h"><div class="section-head"><h2 id="act-h" style="font-size:15px;font-weight:600">Last 14 days</h2><span class="small muted num">' + counts.reduce((a, b) => a + b, 0) + ' answers · ' + state.totals.sessions + ' sessions completed</span></div><div class="chart" role="img" aria-label="Answers per day over the last 14 days: ' + counts.join(', ') + '">' + chart + '</div></section>' +
      '<section class="section" aria-labelledby="words-h"><div class="section-head"><h2 id="words-h">All words</h2></div><div class="filters" role="group" aria-label="Filter words">' + filters + '</div>' +
        '<div class="panel table-wrap">' + (ids.length ? '<table><caption class="sr-only">Vocabulary status</caption><thead><tr><th scope="col">#</th><th scope="col">English</th><th scope="col">Russian</th><th scope="col">Status</th><th scope="col">Accuracy</th></tr></thead><tbody>' + rows + '</tbody></table>' : emptyState('book', 'No words here yet', 'Words move into this group as you study.')) + '</div></section>' +
      '<section class="section" id="settings" aria-labelledby="settings-h"><div class="section-head"><h2 id="settings-h">Settings</h2></div><div class="panel settings">' +
        '<div class="setting"><div><h3><label for="goal-select">Daily goal</label></h3><p>Number of different words to practise each day.</p></div><select class="select" id="goal-select">' + goalOpts + '</select></div>' +
        '<div class="setting"><div><h3>Reset progress</h3><p>Deletes statistics, streak, review list and saved sessions. Vocabulary stays.</p></div><button type="button" class="btn btn-secondary" data-action="resetProgress" style="color:var(--bad)">Reset all progress</button></div>' +
      '</div></section>';
  }

  /* =========================================================
     7b. TEST
     ========================================================= */
  const normRuAnswer = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[.,!?;:«»"“”()]/g, ' ').replace(/\s+/g, ' ').trim();
  const acceptedRu = id => { const r = word(id).russian; return Array.from(new Set([normRuAnswer(r)].concat(r.split(',').map(normRuAnswer)))).filter(Boolean); };
  const testIsLive = () => ui.route === 'test' && !!state.test && !ui.testResult;

  function makeTask(kind, id) {
    const t = { kind, id };
    if (kind === 'tf') {
      const other = pickDistractors(id, 1, 'russian')[0];
      t.shown = (Math.random() < 0.5 || !other) ? id : other; t.truth = t.shown === id;
    } else if (kind === 'mc-en') t.options = shuffle([id].concat(pickDistractors(id, 3, 'english')));
    else if (kind === 'mc-ru') t.options = shuffle([id].concat(pickDistractors(id, 3, 'russian')));
    else if (kind === 'match') {
      const ids = [id];
      for (const o of shuffle(ALL_IDS)) { if (ids.length >= 4) break; if (!ids.includes(o) && !ids.some(x => conflicts(x, o))) ids.push(o); }
      t.ids = ids; t.left = shuffle(ids); t.right = shuffle(ids); t.pairs = {};
    }
    return t;
  }
  function buildTasks(ids, type) {
    let kinds = [];
    if (type === 'combined') { while (kinds.length < ids.length) kinds = kinds.concat(shuffle(TASK_KINDS)); kinds = kinds.slice(0, ids.length); }
    else kinds = ids.map(() => type);
    return ids.map((id, i) => makeTask(kinds[i], id));
  }
  function timerDesc(c) { return c.timer === 'total' ? c.minutes + ' min for the test' : c.timer === 'per' ? c.seconds + ' s per task' : 'No time limit'; }
  const studentName = st => st && (st.first || st.last) ? (st.first + ' ' + st.last).trim() : '';
  function startTest(cfg, ids, student) {
    const now = Date.now();
    const pool = shuffle(ids && ids.length ? ids : ALL_IDS).slice(0, cfg.count);
    state.test = { student: student || { first: '', last: '' }, config: cfg, tasks: buildTasks(pool, cfg.type), index: 0, answers: {}, startedAt: now,
      deadline: cfg.timer === 'total' ? now + cfg.minutes * 60e3 : null, qDeadline: cfg.timer === 'per' ? now + cfg.seconds * 1e3 : null,
      leaves: 0, sel: null, draft: '' };
    ui.testResult = null; ui.shield = false; ui.tsel = { en: null, ru: null }; ui.tflash = null; ui.testError = '';
    save();
    if (ui.route === 'test') { render(true); window.scrollTo(0, 0); focusTest(); } else go('test', true);
  }
  function currentValue(T) {
    const t = T.tasks[T.index];
    if (t.kind === 'tf' || t.kind === 'mc-en' || t.kind === 'mc-ru') return T.sel;
    if (t.kind === 'type-en' || t.kind === 'type-ru') { const el = document.getElementById('test-input'); return String(el ? el.value : T.draft || '').replace(/\s+/g, ' ').trim().slice(0, 120); }
    return null;
  }

  }
  const matchCorrect = t => t.ids.filter(x => t.pairs[x] === x).length;

      case 'mc-en': case 'mc-ru': return value === t.id ? 1 : 0;
      case 'type-en': return acceptedAnswers(t.id).includes(normalizeAnswer(value)) ? 1 : 0;

  }
  function submitTask(timedOut) {

  function advanceTest() {

  function finishTest(reason) {

    const ratio = n ? results.reduce((acc, r) => acc + r.a.score, 0) / n : 0;
    const entry = { at: now, count: n, type: T.config.type, percent: Math.round(ratio * 100), points: Math.round(ratio * 30) / 10,

  function describeTask(t, a) {

    const none = '<span class="muted">' + (a.timedOut ? 'Time ran out' : 'No answer') + '</span>';
    switch (t.kind) {
      case 'tf': return { prompt: E(w.english) + ' → ' + ru(word(t.shown).russian), yours: a.value === true ? 'True' : a.value === false ? 'False' : none, correct: t.truth ? 'True' : 'False · ' + ru(w.russian) };
      case 'mc-en': return { prompt: ru(w.russian), yours: isValidId(a.value) ? E(word(a.value).english) : none, correct: E(w.english) };
      case 'mc-ru': return { prompt: E(w.english), yours: isValidId(a.value) ? ru(word(a.value).russian) : none, correct: ru(w.russian) };
      case 'type-en': return { prompt: ru(w.russian), yours: a.value ? E(a.value) : none, correct: E(w.english) };
      case 'type-ru': return { prompt: E(w.english), yours: a.value ? '<span lang="ru">' + E(a.value) + '</span>' : none, correct: ru(w.russian) };
      default: { const bad = t.ids.filter(x => t.pairs[x] !== x);
        return { prompt: t.ids.map(x => E(word(x).english)).join(', '), yours: a.unanswered ? none : matchCorrect(t) + ' of ' + t.ids.length + ' pairs correct' + (bad.length ? '<br><span class="small muted">' + bad.map(x => E(word(x).english) + ' → ' + (t.pairs[x] !== undefined ? ru(word(t.pairs[x]).russian) : 'not paired')).join('<br>') + '</span>' : ''),

  function go(route, enter) {

    if (ui.route === 'match' && route !== 'match' && sm) { commitMatchTime(sm); save(); }
    if (route === 'match') ui.matchTick = Date.now();
    const changed = ui.route !== route;
    ui.route = route; ui.menuOpen = false; ui.setupError = ''; ui.writeError = ''; ui.flipped = false; ui.matchSel = { en: null, ru: null };

    if (changed && route !== 'test') ui.testResult = null;
    if (changed) { ui.shield = false; renderShield(); ui.testError = ''; }

    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const onButton = tag === 'BUTTON' || e.target.getAttribute('role') === 'button';
    const key = e.key;
    if (ui.route === 'flashcards' && state.sessions.flashcards && !ui.completion.flashcards) {
      const c = fcCurrent(state.sessions.flashcards);
      if (c.stage === 'front') { if (key === 'k' || key === 'K') { e.preventDefault(); ACTIONS.fcKnow(); return; } if (key === 'p' || key === 'P') { ACTIONS.fcPractice(); return; } }
      if (c.stage === 'done' && key === 'Enter' && !onButton) { e.preventDefault(); ACTIONS.fcNext(); return; }
    }
    if (testIsLive() && !ui.shield) {
      const T = state.test, t = T.tasks[T.index], a = T.answers[T.index];
      if (!a && t.kind === 'tf') { if (key === 't' || key === 'T' || key === '1') { testSelect(true); return; } if (key === 'f' || key === 'F' || key === '2') { testSelect(false); return; } }
      if (!a && (t.kind === 'mc-en' || t.kind === 'mc-ru') && /^[1-9]$/.test(key)) { const n = Number(key); if (n <= t.options.length) testSelect(t.options[n - 1]); return; }
      if (key === 'Enter' && !onButton) { e.preventDefault(); ACTIONS.testNext(); return; }
    }
    if (ui.route === 'learn' && state.sessions.learn && !ui.completion.learn) {
      const c = state.sessions.learn.current;
      if (c && c.picked === null && /^[1-9]$/.test(key)) { const n = Number(key); if (n <= c.options.length) { e.preventDefault(); ACTIONS.learnPick({ dataset: { id: String(c.options[n - 1]) } }); } return; }
      if (c && c.picked !== null && key === 'Enter' && !onButton) { e.preventDefault(); ACTIONS.learnContinue(); }
    }
  });

  /* =========================================================
     9. DIALOG, TOASTS, ANNOUNCER, CELEBRATION
     ========================================================= */
  function openConfirm(opts) {
    ui.lastFocus = document.activeElement;
    ui.dialog = opts;
    const root = document.getElementById('dialog-root');
    root.innerHTML = '<div class="overlay" data-dialog-overlay><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-body"><h2 id="dlg-title">' + esc(opts.title) + '</h2><p id="dlg-body">' + esc(opts.body) + '</p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" id="dlg-cancel">Cancel</button><button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="dlg-ok">' + esc(opts.confirm) + '</button></div></div></div>';
    document.getElementById('dlg-cancel').addEventListener('click', closeDialog);
    document.getElementById('dlg-ok').addEventListener('click', () => { const fn = ui.dialog && ui.dialog.onConfirm; closeDialog(true); if (fn) fn(); });
    root.querySelector('[data-dialog-overlay]').addEventListener('click', e => { if (e.target.hasAttribute('data-dialog-overlay')) closeDialog(); });
    document.getElementById('dlg-cancel').focus();
  }
  function closeDialog(skipFocus) {
    ui.dialog = null;
    document.getElementById('dialog-root').innerHTML = '';
    if (skipFocus !== true && ui.lastFocus && document.contains(ui.lastFocus)) ui.lastFocus.focus();
  }
  function handleDialogKeys(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeDialog(); return; }
    if (e.key === 'Tab') {
      const f = Array.from(document.querySelectorAll('#dialog-root button'));
      const i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  }
  function toast(msg) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => t.remove(), 2400);
  }
  function announce(msg) { const a = document.getElementById('announcer'); a.textContent = ''; setTimeout(() => { a.textContent = msg; }, 30); }
  function celebrate() {
    if (reducedMotion()) return;
    const c = document.createElement('div'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
    const colors = ['var(--accent)', 'var(--ok)', 'var(--warn)', 'var(--accent-ink)'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('i');
      const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 140;
      p.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--y', Math.sin(ang) * dist * 0.8 + 60 + 'px');
      p.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 80) + 'ms';
      c.appendChild(p);
    }
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1400);
  }

  // Save match clock when the page is hidden or closed.
  const flushTime = () => { const s = state.sessions.match; if (s && ui.route === 'match') { commitMatchTime(s); save(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) { flushTime(); shieldOn(); } else ui.matchTick = Date.now(); });
  window.addEventListener('blur', () => shieldOn());
  document.addEventListener('keyup', e => { if (e.key === 'PrintScreen' && testIsLive()) { shieldOn(); try { navigator.clipboard && navigator.clipboard.writeText(' ').catch(() => {}); } catch (err) { /* ignore */ } } });
  ['copy', 'cut', 'contextmenu', 'dragstart'].forEach(type => document.addEventListener(type, e => { if (testIsLive() && !(e.target.tagName === 'INPUT' && type !== 'contextmenu')) e.preventDefault(); }));
  window.addEventListener('beforeprint', () => shieldOn());
  window.addEventListener('pagehide', flushTime);

  // Self-check of the dataset at startup (logged, never blocks the app).
  (function verify() {
    const ids = new Set(ALL_IDS);
    if (ids.size !== TOTAL || vocabulary.some(v => !v.english || !v.russian)) console.error('Vocabulary data is invalid.');
  })();

  // Expose a read-only hook for automated checks.
  window.__vocabApp = { vocabulary, conflicts, pickDistractors, buildRounds, normalizeAnswer, acceptedAnswers, getState: () => state, sanitize };

  applyPalette();
  render(true);
})();
</script>
